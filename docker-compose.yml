version: '3.7'
services:
  kafka:
    image: confluentinc/cp-kafka:7.0.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_NODE_ID: 1
      # Listeners para broker (externo) y controlador (interno KRaft)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # Anuncia la IP real del host para clientes externos (PC_B)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://172.27.141.245:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      # Configuración mínima para KRaft (modo sin Zookeeper)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-storage/log"
      KAFKA_JMX_PORT: 9999
      KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      # Voter del controlador apunta al listener interno del contenedor
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
    # Si tu red requiere DNS o IP fija, puedes agregar networks/extra_hosts
    # networks:
    #   - evnet

#networks:
#  evnet:
#    driver: bridge
