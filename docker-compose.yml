services:
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft sin Zookeeper (1 nodo broker+controller)
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_NODE_ID=1
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://172.21.42.15:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LOG_DIRS=/tmp/kraft-combined-logs
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      # Cluster ID requerido para formatear almacenamiento en KRaft
      - CLUSTER_ID=4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server 127.0.0.1:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # MySQL 5.7 para máxima compatibilidad con Windows y Python
  # Configurado SIN CONTRASEÑA (modo desarrollo)
  mariadb:
    image: mysql:5.7
    container_name: mariadb
    ports:
      - "3306:3306"
    environment:
      # Usar contraseña temporal 'root' solo para inicialización
      # El script setup_sin_autenticacion.sql eliminará la contraseña después
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=evcharging
      # Permitir conexiones root desde cualquier host (necesario para conexiones externas)
      - MYSQL_ROOT_HOST=%
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/setup_sin_autenticacion.sql:/docker-entrypoint-initdb.d/02_setup.sql
    healthcheck:
      # Healthcheck sin contraseña
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Creador automático de topics de Kafka
  kafka-setup:
    image: confluentinc/cp-kafka:7.7.0
    container_name: kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Esperando a que Kafka esté listo...';
        sleep 10;
        echo 'Creando topics necesarios...';
        kafka-topics --create --topic telemetria_cp --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --if-not-exists;
        kafka-topics --create --topic driver_requests --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --if-not-exists;
        kafka-topics --create --topic central_commands --bootstrap-server kafka:9092 --partitions 1 --replication-factor 1 --if-not-exists;
        echo 'Topics creados:';
        kafka-topics --list --bootstrap-server kafka:9092;
        echo 'Setup completado.';
      "
    restart: "no"

volumes:
  mariadb_data:
    driver: local

networks:
  default:
    name: evnet
    driver: bridge
